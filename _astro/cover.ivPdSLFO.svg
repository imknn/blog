<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16"/>
      <stop offset="50%" style="stop-color:#0a3d1e"/>
      <stop offset="100%" style="stop-color:#0c2d3a"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="node1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="node2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="node3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="100" fill="#10b981" opacity="0.06"/>
  <circle cx="680" cy="310" r="120" fill="#06b6d4" opacity="0.08"/>
  <circle cx="400" cy="200" r="70" fill="#14b8a6" opacity="0.05"/>

  <!-- Code Graph nodes and edges -->
  <g transform="translate(400, 195)" filter="url(#glow)">
    <!-- Edges -->
    <line x1="0" y1="-30" x2="80" y2="-50" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-30" x2="-75" y2="-45" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="30" x2="85" y2="50" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="30" x2="-80" y2="55" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <line x1="80" y1="-50" x2="150" y2="-35" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    <line x1="-75" y1="-45" x2="-145" y2="-55" stroke="#10b981" stroke-width="1" opacity="0.4"/>
    <line x1="85" y1="50" x2="148" y2="40" stroke="#14b8a6" stroke-width="1" opacity="0.4"/>
    <line x1="-80" y1="55" x2="-140" y2="65" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    <line x1="80" y1="-50" x2="85" y2="50" stroke="#10b981" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>
    <line x1="-75" y1="-45" x2="-80" y2="55" stroke="#06b6d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>

    <!-- Center node (root) -->
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="url(#accent1)" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">CG</text>

    <!-- Surrounding nodes -->
    <circle cx="0" cy="-30" r="10" fill="url(#node1)"/>
    <circle cx="80" cy="-50" r="8" fill="url(#node2)" filter="url(#softglow)"/>
    <circle cx="-75" cy="-45" r="8" fill="url(#node1)" filter="url(#softglow)"/>
    <circle cx="0" cy="30" r="10" fill="url(#node3)"/>
    <circle cx="85" cy="50" r="8" fill="url(#node3)" filter="url(#softglow)"/>
    <circle cx="-80" cy="55" r="8" fill="url(#node2)" filter="url(#softglow)"/>

    <!-- Outer nodes -->
    <circle cx="150" cy="-35" r="5" fill="#10b981" opacity="0.5" filter="url(#softglow)"/>
    <circle cx="-145" cy="-55" r="5" fill="#06b6d4" opacity="0.5" filter="url(#softglow)"/>
    <circle cx="148" cy="40" r="5" fill="#14b8a6" opacity="0.5" filter="url(#softglow)"/>
    <circle cx="-140" cy="65" r="5" fill="#10b981" opacity="0.5" filter="url(#softglow)"/>

    <!-- Extra connection dots -->
    <circle cx="155" cy="-60" r="3" fill="#06b6d4" opacity="0.3" filter="url(#softglow)"/>
    <circle cx="-155" cy="-75" r="3" fill="#10b981" opacity="0.3" filter="url(#softglow)"/>
    <circle cx="160" cy="65" r="3" fill="#14b8a6" opacity="0.3" filter="url(#softglow)"/>
    <circle cx="-150" cy="85" r="3" fill="#06b6d4" opacity="0.3" filter="url(#softglow)"/>
  </g>

  <!-- MCP tool bar -->
  <rect x="130" y="280" width="540" height="36" rx="6" fill="#052e16" opacity="0.6" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.3"/>
  <g transform="translate(158, 299)">
    <rect x="0" y="-6" width="36" height="12" rx="2" fill="#10b981" opacity="0.5"/>
    <text x="40" y="3" fill="#94a3b8" font-family="Arial" font-size="10">codegraph_search</text>
    <rect x="148" y="-6" width="36" height="12" rx="2" fill="#06b6d4" opacity="0.5"/>
    <text x="188" y="3" fill="#94a3b8" font-family="Arial" font-size="10">codegraph_trace</text>
    <rect x="308" y="-6" width="36" height="12" rx="2" fill="#14b8a6" opacity="0.5"/>
    <text x="348" y="3" fill="#94a3b8" font-family="Arial" font-size="10">codegraph_impact</text>
  </g>

  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">OpenCode + CodeGraph</text>
  <text x="400" y="82" text-anchor="middle" fill="#10b981" font-family="Arial" font-size="15" opacity="0.9">Code Intelligence for AI Agents</text>

  <!-- Footer -->
  <text x="400" y="375" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" opacity="0.8">izqy.top</text>
</svg>
