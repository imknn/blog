<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080b1f"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#24124d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- 模糊光斑 -->
  <circle cx="150" cy="120" r="90" fill="#e94560" opacity="0.12"/>
  <circle cx="650" cy="280" r="110" fill="#3b82f6" opacity="0.1"/>

  <!-- 网格线 -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- 标题 -->
  <text x="400" y="65" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">Claude Code</text>
  <text x="400" y="100" text-anchor="middle" fill="#e94560" font-family="Arial" font-size="17">AskUserQuestion Tool Guide</text>

  <!-- 终端窗口 -->
  <g transform="translate(240, 140)">
    <rect x="0" y="0" width="320" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="320" height="24" rx="8" fill="#21262d"/>
    <circle cx="14" cy="12" r="4" fill="#f85149"/>
    <circle cx="28" cy="12" r="4" fill="#f0883e"/>
    <circle cx="42" cy="12" r="4" fill="#3fb950"/>
    <text x="14" y="52" font-family="monospace" font-size="12" fill="#8b949e">$ claude</text>
    <text x="14" y="72" font-family="monospace" font-size="11" fill="#58a6ff">How would you like to proceed?</text>
    <rect x="10" y="85" width="140" height="24" rx="4" fill="#1a2332" stroke="#e94560" stroke-width="1"/>
    <text x="80" y="101" font-family="monospace" font-size="10" fill="#e94560" text-anchor="middle">Option A</text>
    <rect x="165" y="85" width="140" height="24" rx="4" fill="#1a2332" stroke="#3b82f6" stroke-width="1"/>
    <text x="235" y="101" font-family="monospace" font-size="10" fill="#3b82f6" text-anchor="middle">Option B</text>
    <text x="14" y="140" font-family="monospace" font-size="10" fill="#3fb950">▸ Waiting for input...</text>
  </g>

  <!-- 装饰元素 -->
  <circle cx="100" cy="200" r="30" fill="none" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <circle cx="700" cy="180" r="25" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>

  <!-- 底部 URL -->
  <text x="400" y="375" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" opacity="0.8">izqy.top</text>
</svg>